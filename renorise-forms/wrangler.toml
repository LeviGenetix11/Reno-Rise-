name = "renorise-forms"
main = "src/index.js"
compatibility_date = "2026-09-19"

# --- D1 database ------------------------------------------------------
# Targets your EXISTING database (renorise-leads) — no new database is
# created. The ID is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "renorise-leads"
database_id = "debd2c89-e46b-4585-9693-0f83f35cb0de"

# --- Scheduled retry sweep for pending/failed emails -------------------
# Runs every 15 minutes; see src/index.js `scheduled()`.
[triggers]
crons = ["*/15 * * * *"]

# --- Non-secret configuration -------------------------------------------
# RESEND_API_KEY and TURNSTILE_SECRET_KEY are NOT here — they're set via
# `wrangler secret put`, never committed to the repo or wrangler.toml.
[vars]
ALLOWED_ORIGINS = "https://renosrise.com,https://www.renosrise.com"
INTERNAL_NOTIFY_EMAIL = "hello@renosrise.com"
CUSTOMER_FROM_EMAIL = "RenoRise <hello@notify.renosrise.com>"
REPLY_TO_EMAIL = "hello@renosrise.com"
